      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const duration = 9.9;
          const commandOne = "uv tool install omnireach";
          const commandTwo = "omnireach bridge install";
          const textOne = document.getElementById("f06-command-text-1");
          const textTwo = document.getElementById("f06-command-text-2");
          const cursorOne = document.getElementById("f06-cursor-1");
          const cursorTwo = document.getElementById("f06-cursor-2");
          const tl = gsap.timeline({ paused: true });

          function typedText(text, time, start, end) {
            if (time < start) return "";
            if (time >= end) return text;
            const progress = (time - start) / (end - start);
            return text.slice(0, Math.floor(progress * text.length));
          }

          function cursorState(time, start, end, period) {
            if (time < start || time >= end) return "0";
            const phase = ((time - start) / period) * Math.PI * 2;
            return Math.sin(phase) >= -0.2 ? "1" : "0";
          }

          const typeClock = { time: 0 };
          tl.to(
            typeClock,
            {
              time: 4.8,
              duration: 4.8,
              ease: "none",
              onUpdate: () => {
                const time = typeClock.time;
                textOne.textContent = typedText(commandOne, time, 2.08, 3.16);
                textTwo.textContent = typedText(commandTwo, time, 3.32, 4.52);
                cursorOne.style.opacity = cursorState(time, 2.08, 3.16, 0.58);
                cursorTwo.style.opacity = cursorState(time, 3.32, 4.52, 0.58);
              },
            },
            0,
          );

          tl.fromTo(
            "#f06-boundary-a",
            { opacity: 0, scale: 1.12 },
            { opacity: 1, scale: 1, duration: 0.34, ease: "power4.out" },
            0.06,
          );
          tl.set("#f06-boundary-a", { opacity: 0 }, 0.88);
          tl.set("#f06-boundary-b", { opacity: 1 }, 0.88);
          tl.fromTo(
            "#f06-boundary-b",
            { scale: 1.08 },
            { scale: 1, duration: 0.3, ease: "power4.out" },
            0.88,
          );
          tl.to(
            "#f06-boundary-shell",
            { y: -76, scale: 0.82, duration: 0.36, ease: "power3.inOut" },
            1.54,
          );

          tl.fromTo(
            "#f06-terminal",
            { y: 72, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.44, ease: "power4.out" },
            1.9,
          );
          tl.fromTo(
            "#f06-command-row-1",
            { x: 20, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.24, ease: "expo.out" },
            2.02,
          );
          tl.fromTo(
            "#f06-command-row-2",
            { x: 20, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.24, ease: "expo.out" },
            3.26,
          );

          tl.fromTo(
            "#f06-challenge-1",
            { y: 64, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.46, ease: "power4.out" },
            4.86,
          );
          tl.fromTo(
            "#f06-challenge-2",
            { x: 56, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.44, ease: "expo.out" },
            5.78,
          );
          tl.fromTo(
            "#f06-challenge-3",
            { y: 52, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
            6.72,
