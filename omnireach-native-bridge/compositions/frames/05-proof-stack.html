  <script>
    (() => {
      window.__timelines = window.__timelines || {};

      const headline = document.getElementById("f05-headline");
      const runStamp = document.getElementById("f05-run-stamp");
      const row01 = document.getElementById("f05-row-01");
      const row02 = document.getElementById("f05-row-02");
      const row03 = document.getElementById("f05-row-03");
      const row04 = document.getElementById("f05-row-04");
      const value01 = document.getElementById("f05-value-01");
      const pathNote = document.getElementById("f05-path-note");
      const value02 = document.getElementById("f05-value-02");
      const value03 = document.getElementById("f05-value-03");
      const windowsState = document.getElementById("f05-windows");
      const tabsState = document.getElementById("f05-tabs");
      const verificationPath = document.getElementById(
        "f05-verification-path",
      );

      const verificationLength = verificationPath.getTotalLength();
      verificationPath.style.strokeDasharray = `${verificationLength}`;
      verificationPath.style.strokeDashoffset = `${verificationLength}`;

      const tl = gsap.timeline({ paused: true });

      tl.set([row01, row02, row03, row04], { opacity: 0, x: -54, scale: 0.985 }, 0);
      tl.set(
        [value01, pathNote, value02, value03, windowsState, tabsState],
        { opacity: 0, x: -18 },
        0,
      );

      tl.fromTo(
        headline,
        { opacity: 0, y: 38 },
        {
          opacity: 1,
          y: 0,
          duration: 0.72,
          ease: "power3.out",
          immediateRender: false,
        },
        0.08,
      );
      tl.fromTo(
        runStamp,
        { opacity: 0, y: 18 },
        {
          opacity: 1,
          y: 0,
          duration: 0.52,
          ease: "power2.out",
          immediateRender: false,
        },
        0.64,
      );

      tl.fromTo(
        row01,
        { opacity: 0, x: -54, scale: 0.985 },
        {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 0.82,
          ease: "power3.out",
          immediateRender: false,
        },
        1.55,
      );
      tl.to(value01, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 2.36);
      tl.to(pathNote, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, 2.92);

      tl.fromTo(
        row02,
        { opacity: 0, x: -54, scale: 0.985 },
        {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 0.82,
          ease: "power3.out",
          immediateRender: false,
        },
        3.72,
      );
      tl.to(value02, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 4.62);

      tl.fromTo(
        row03,
        { opacity: 0, x: -54, scale: 0.985 },
        {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 0.82,
          ease: "power3.out",
          immediateRender: false,
        },
        6.12,
      );
      tl.to(value03, { opacity: 1, x: 0, duration: 0.48, ease: "power2.out" }, 7.02);

      tl.fromTo(
        row04,
        { opacity: 0, x: -54, scale: 0.985 },
        {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 0.86,
          ease: "power3.out",
          immediateRender: false,
        },
        8.42,
      );
      tl.to(
        windowsState,
        { opacity: 1, x: 0, duration: 0.52, ease: "power2.out" },
        9.4,
      );
      tl.to(
        tabsState,
        { opacity: 1, x: 0, duration: 0.52, ease: "power2.out" },
        10.22,
      );

      tl.to(
        verificationPath,
        {
          strokeDashoffset: 0,
          duration: 0.86,
          ease: "power2.out",
        },
        11.78,
      );

      window.__timelines["05-proof-stack"] = tl;
    })();
  </script>
