      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const compositionRoot = document.querySelector(
          '[data-composition-id="04-real-douyin-search"]',
        );
        const stageLabel = compositionRoot.querySelector(".stage-label");
        const terminal = compositionRoot.querySelector(".terminal");
        const commandLineOne = compositionRoot.querySelector(
          '[id="f04-command-line-one"]',
        );
        const commandLineTwo = compositionRoot.querySelector(
          '[id="f04-command-line-two"]',
        );
        const cursorOne = compositionRoot.querySelector(
          '[id="f04-cursor-one"]',
        );
        const cursorTwo = compositionRoot.querySelector(
          '[id="f04-cursor-two"]',
        );
        const statusLine = compositionRoot.querySelector(".status-line");
        const statusValue = compositionRoot.querySelector(
          '[id="f04-status-value"]',
        );
        const resultRows = compositionRoot.querySelectorAll(".result-row");
        const verifiedRule = compositionRoot.querySelector(".verified-rule");
        const terminalFooter = compositionRoot.querySelector(".terminal-footer");

        const lineOne =
          "env PATH=/usr/bin:/bin:/usr/sbin:/sbin OMNIREACH_BROWSER_TRANSPORT=native";
        const lineTwo =
          '$HOME/.local/bin/omnireach search "gpt5.6" --on douyin --limit 3 --timeout 45 --json';
        const fullCommand = `${lineOne} ${lineTwo}`;
        const transportStart = fullCommand.indexOf(
          "OMNIREACH_BROWSER_TRANSPORT",
        );
        const queryStart = fullCommand.indexOf('"gpt5.6"');
        const queryEnd = queryStart + '"gpt5.6"'.length;
        let typedCount = 0;
        let blinkVisible = true;

        function cursorColorAt(count) {
          if (count >= fullCommand.length) return "#50e878";
          if (count >= transportStart && count <= lineOne.length) return "#ffcc38";
          if (count >= queryStart && count <= queryEnd) return "#ffcc38";
          return "#f4f3ee";
        }

        function renderCursors() {
          const cursorColor = cursorColorAt(typedCount);
          const activeOpacity = blinkVisible ? "1" : "0";
          const onFirstLine = typedCount <= lineOne.length;
          cursorOne.style.background = cursorColor;
          cursorTwo.style.background = cursorColor;
          cursorOne.style.opacity = onFirstLine ? activeOpacity : "0";
          cursorTwo.style.opacity = onFirstLine ? "0" : activeOpacity;
        }

        function renderCommand(count) {
          typedCount = Math.max(
            0,
            Math.min(fullCommand.length, Math.floor(count)),
          );
          const firstCount = Math.min(typedCount, lineOne.length);
          const secondCount = Math.max(0, typedCount - lineOne.length - 1);
          commandLineOne.textContent = lineOne.slice(0, firstCount);
          commandLineTwo.textContent = lineTwo.slice(0, secondCount);
          renderCursors();
        }

        const statusStates = [
          { t: 0, text: "", color: "#ffcc38" },
          { t: 3.2, text: "searching douyin…", color: "#ffcc38" },
          { t: 4.4, text: "3 results · errors []", color: "#50e878" },
        ];

        function statusAt(time) {
          for (let index = statusStates.length - 1; index >= 0; index -= 1) {
            if (time >= statusStates[index].t) return statusStates[index];
          }
          return statusStates[0];
        }

        function renderStatus(time) {
          const state = statusAt(time);
          statusValue.textContent = state.text;
          statusValue.style.color = state.color;
        }

        renderCommand(0);
        renderStatus(0);

        const tl = gsap.timeline({ paused: true });
        const commandDriver = { count: 0 };
        const statusDriver = { time: 0 };
        const blinkDriver = { phase: 0 };

        tl.fromTo(
          terminal,
          { opacity: 0, y: 32 },
          { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
          0,
        );
        tl.fromTo(
          stageLabel,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          0.08,
        );

        tl.to(
          commandDriver,
          {
            count: fullCommand.length,
            duration: 2,
            ease: "none",
            onUpdate: () => renderCommand(commandDriver.count),
          },
          1.2,
        );

        tl.to(
          blinkDriver,
          {
            phase: Math.PI * 18,
            duration: 7.4,
            ease: "none",
            onUpdate: () => {
              blinkVisible = Math.sin(blinkDriver.phase) >= 0;
              renderCursors();
            },
          },
          0,
        );

        tl.to(
          statusDriver,
          {
            time: 7.4,
            duration: 7.4,
            ease: "none",
            onUpdate: () => renderStatus(statusDriver.time),
          },
          0,
        );
        tl.fromTo(
          statusLine,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },
          3.2,
        );

        tl.fromTo(
          resultRows[0],
          { opacity: 0, x: 28 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power4.out" },
          4.4,
        );
        tl.fromTo(
          verifiedRule,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.5, ease: "power3.out" },
          4.44,
        );
        tl.fromTo(
          resultRows[1],
          { opacity: 0, x: 28 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power4.out" },
          5.08,
        );
        tl.fromTo(
          resultRows[2],
          { opacity: 0, x: 28 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power4.out" },
          5.76,
        );
        tl.fromTo(
          terminalFooter,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          6.42,
        );

        window.__timelines["04-real-douyin-search"] = tl;
      </script>
