    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-ghost-window", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#el-02-break-the-loop", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 3.5);
        tl.to("#el-02-break-the-loop", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 7.7);
        tl.fromTo("#el-03-native-tunnel", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 7.7);
        tl.to("#el-03-native-tunnel", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.fromTo("#el-04-live-hitstorm", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.to("#el-04-live-hitstorm", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 20.8);
        tl.fromTo("#el-05-proof-lock", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 20.8);
        tl.to({}, { duration: 36.1 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
