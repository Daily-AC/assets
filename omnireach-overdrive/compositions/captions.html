<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Noto Sans CJK SC'; src: url('assets/fonts/NotoSansCJKSC-Bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
      @font-face { font-family: 'Noto Sans CJK SC'; src: url('assets/fonts/NotoSansCJKSC-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
      :root {
      --black: #F5F7FF;
      --white: #07090D;
      --offwhite: #050505;
      --pink: #700047;
      --blue: #003940;
      --green: #008191;
      --yellow: #31E8FF;
      --cream: #FF2FB3;
      --status-success: #B6FF3B;
      --status-danger: #FF4A5F;
      --status-warning: #FFD84D;
      --cap-ink: #F5F7FF;
      --cap-canvas: #07090D;
      --cap-accent: #FF2FB3;
      --cap-accent-2: #31E8FF;
      --font-display: "Noto Sans CJK SC", system-ui, serif;
      --font-body: "Noto Sans CJK SC", system-ui, sans-serif;
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE bordered card — 4px black border + 8px hard offset shadow (solid black,
     zero blur, bottom-right — blockframe's sacred depth), square corners */
  .caption-pill {
    max-width: 80%;
    padding: 18px 40px 22px;
    background: var(--cap-canvas, #ffffff);
    border: 4px solid var(--cap-ink, #000000);
    border-radius: 0;
    box-shadow: 8px 8px 0 var(--cap-ink, #000000);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.32em;
    font-family: "Noto Sans CJK SC", system-ui, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  /* upcoming — faded black ink, no stamp */
  .caption-word {
    display: inline-block;
    padding: 0 0.1em;
    color: color-mix(in srgb, var(--cap-ink, #000000) 40%, var(--cap-canvas, #ffffff));
  }
  /* current word — THE yellow stamp-block (box-shadow spread = a hard square block
     w/o layout shift; no blur), black ink reading on top — blockframe's signature stamp */
  .caption-word.is-active {
    color: var(--cap-ink, #000000);
    background: var(--cap-accent, #f7cb46);
    box-shadow: 0 0 0 0.08em var(--cap-accent, #f7cb46);
  }
  /* already spoken — solid black ink, stamp cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #000000);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — heavier ink weight, blockframe's display is already 900 */
  .caption-word.cap-brand {
    color: var(--cap-ink, #000000);
  }
  /* numerals / data — the body voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Noto Sans CJK SC", ui-monospace, monospace;
    color: color-mix(in srgb, var(--cap-ink, #000000) 74%, var(--cap-canvas, #ffffff));
  }
  /* emphasis — a cream hard underline bar (the second-chroma accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 4px;
    text-decoration-color: var(--cap-accent-2, #ffdc8b);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="36.1"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.08,"end":2.335,"text":"Agent 搜个抖音，怎么又弹","words":[{"id":"caption-word-0-0","text":"Agent 搜个抖音，怎么又弹","start":0.08,"end":2.215}]},{"id":"caption-group-1","frame":1,"start":2.396,"end":3.366,"text":"Chrome？","words":[{"id":"caption-word-1-0","text":"Chrome？","start":2.396,"end":3.246}]},{"id":"caption-group-2","frame":2,"start":3.58,"end":4.719,"text":"搜索和读取，","words":[{"id":"caption-word-2-0","text":"搜索和读取，","start":3.58,"end":4.599}]},{"id":"caption-group-3","frame":2,"start":4.78,"end":7.433,"text":"不该每次拉起整套浏览器自动化。","words":[{"id":"caption-word-3-0","text":"不该每次拉起整套浏览器自动化。","start":4.78,"end":7.313}]},{"id":"caption-group-4","frame":3,"start":7.78,"end":8.907,"text":"Omnireach","words":[{"id":"caption-word-4-0","text":"Omnireach","start":7.78,"end":8.787}]},{"id":"caption-group-5","frame":3,"start":8.968,"end":11.147,"text":"直接复用你已经登录的 Chrome，","words":[{"id":"caption-word-5-0","text":"直接复用你已经登录的 Chrome，","start":8.968,"end":11.027}]},{"id":"caption-group-6","frame":3,"start":11.208,"end":12.747,"text":"只走一条只读原生桥。","words":[{"id":"caption-word-6-0","text":"只走一条只读原生桥。","start":11.208,"end":12.627}]},{"id":"caption-group-7","frame":4,"start":13.08,"end":14.059,"text":"真实运行，","words":[{"id":"caption-word-7-0","text":"真实运行，","start":13.08,"end":13.939}]},{"id":"caption-group-8","frame":4,"start":14.12,"end":15.818,"text":"三条抖音结果，","words":[{"id":"caption-word-8-0","text":"三条抖音结果，","start":14.12,"end":15.698}]},{"id":"caption-group-9","frame":4,"start":15.879,"end":20.537,"text":"adapter 是 native-chrome。","words":[{"id":"caption-word-9-0","text":"adapter 是 native-chrome。","start":15.879,"end":20.417}]},{"id":"caption-group-10","frame":5,"start":20.88,"end":25.539,"text":"PATH 里没有 OpenCLI。","words":[{"id":"caption-word-10-0","text":"PATH 里没有 OpenCLI。","start":20.88,"end":25.419}]},{"id":"caption-group-11","frame":5,"start":25.6,"end":27.857,"text":"errors 为空。","words":[{"id":"caption-word-11-0","text":"errors 为空。","start":25.6,"end":27.737}]},{"id":"caption-group-12","frame":5,"start":27.918,"end":30.964,"text":"可见窗口和标签页，零到零。","words":[{"id":"caption-word-12-0","text":"可见窗口和标签页，零到零。","start":27.918,"end":30.844}]},{"id":"caption-group-13","frame":5,"start":31.025,"end":33.524,"text":"点击和表单，交给 Playwright。","words":[{"id":"caption-word-13-0","text":"点击和表单，交给 Playwright。","start":31.025,"end":33.404}]},{"id":"caption-group-14","frame":5,"start":33.585,"end":35.044,"text":"搜索和读取，","words":[{"id":"caption-word-14-0","text":"搜索和读取，","start":33.585,"end":34.924}]},{"id":"caption-group-15","frame":5,"start":35.105,"end":36.083,"text":"装完就用。","words":[{"id":"caption-word-15-0","text":"装完就用。","start":35.105,"end":35.963}]}];
  var DURATION = 36.1;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.86 }, { scale: 1, duration: 0.2, ease: "back.out(2.4)" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
<style>
  .caption-word { color: color-mix(in srgb, var(--cap-ink) 64%, var(--cap-canvas)); }
  .caption-word.is-active { color: var(--cap-ink); background: var(--cap-accent); box-shadow: 0 0 0 0.06em var(--cap-accent); }
  .caption-word.is-spoken { color: var(--cap-ink); background: transparent; box-shadow: none; }
</style>
</template>
