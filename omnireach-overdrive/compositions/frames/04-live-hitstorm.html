      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const root = document.getElementById("root");
          const world = document.getElementById("frame04-live-hitstorm-world");
          const terminal = document.getElementById("frame04-live-hitstorm-terminal");
          const commandText = document.getElementById("frame04-live-hitstorm-command-text");
          const commandPan = document.getElementById("frame04-live-hitstorm-command-pan");
          const commandCursor = document.getElementById("frame04-live-hitstorm-command-cursor");
          const hitNumber = document.getElementById("frame04-live-hitstorm-hit-number");
          const adapterValue = document.getElementById("frame04-live-hitstorm-adapter-value");

          const camera = { x: 0, y: 55, scale: 1.06 };

          function applyCamera() {
            world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
          }
          applyCamera();

          const fullCommand = 'omnireach search "gpt5.6" --on douyin --limit 3 --json';
          const commandStates = [
            { t: 0.0, text: "" },
            { t: 0.08, text: "omni" },
            { t: 0.14, text: "omnireach" },
            { t: 0.22, text: "omnireach search" },
            { t: 0.31, text: 'omnireach search "gpt' },
            { t: 0.38, text: 'omnireach search "gpt5.6"' },
            { t: 0.48, text: 'omnireach search "gpt5.6" --on' },
            { t: 0.57, text: 'omnireach search "gpt5.6" --on douyin' },
            { t: 0.69, text: 'omnireach search "gpt5.6" --on douyin --limit' },
            { t: 0.76, text: 'omnireach search "gpt5.6" --on douyin --limit 3' },
            { t: 0.88, text: fullCommand },
          ];

          function commandAt(time) {
            for (let index = commandStates.length - 1; index >= 0; index -= 1) {
              if (time >= commandStates[index].t) return commandStates[index].text;
            }
            return "";
          }

          const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*";

          function pseudoGlyph(seed) {
            const normalized = ((seed * 9301 + 49297) % 233280) / 233280;
            return glyphs[Math.floor(normalized * glyphs.length)];
          }

          const adapterTarget = adapterValue.dataset.target;
          const adapterGhost = document.createElement("span");
          adapterGhost.className = "adapter-ghost";
          adapterGhost.textContent = adapterTarget;
          adapterValue.appendChild(adapterGhost);

          const adapterLive = document.createElement("span");
          adapterLive.className = "adapter-live";
          const adapterChars = [];
          Array.from(adapterTarget).forEach((character, index) => {
            const element = document.createElement("span");
            element.className = "adapter-char";
            element.dataset.target = character;
            element.textContent = pseudoGlyph(index * 1000);
            element.style.transform = "rotateX(90deg)";
            element.style.opacity = "0";
            adapterLive.appendChild(element);
            adapterChars.push(element);
          });
          adapterValue.appendChild(adapterLive);

          const timeline = gsap.timeline({ paused: true });

          timeline.fromTo(
            terminal,
            { y: -250, rotation: -7, scale: 0.9, opacity: 0 },
            { y: 0, rotation: -2, scale: 1, opacity: 1, duration: 0.42, ease: "power4.out" },
            0,
          );

          const typeDriver = { t: 0 };
          let previousCommand = "";
          timeline.fromTo(
            typeDriver,
            { t: 0 },
            {
              t: 1.02,
              duration: 1.02,
              ease: "none",
              onUpdate: () => {
                const visibleCommand = commandAt(typeDriver.t);
                if (visibleCommand !== previousCommand) {
                  commandText.textContent = visibleCommand;
                  previousCommand = visibleCommand;
                }
                const cursorWorldX = 54 + visibleCommand.length * 14.6;
                const trackingOffset = Math.min(0, 584 - cursorWorldX);
                commandPan.style.transform = `translateX(${trackingOffset}px)`;
              },
            },
            0,
          );

          const blinkDriver = { phase: 0 };
          timeline.fromTo(
            blinkDriver,
            { phase: 0 },
            {
              phase: Math.PI * 18,
              duration: 5.85,
              ease: "none",
              onUpdate: () => {
                commandCursor.style.opacity = Math.sin(blinkDriver.phase) >= 0 ? "1" : "0";
              },
            },
            0,
          );

          timeline.to(
            camera,
            {
              x: 0,
              y: -10,
              scale: 0.96,
              duration: 0.72,
              ease: "power3.inOut",
              onUpdate: applyCamera,
            },
            1.02,
          );

          timeline.fromTo(
            "#frame04-live-hitstorm-hit-card",
            { scale: 0.88, y: 34, opacity: 0 },
            { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
            1.12,
          );

          const counterState = { value: 0, scale: 70 / 118 };
          timeline.to(
            counterState,
            {
              value: 3,
              scale: 1,
              duration: 0.78,
              ease: "power3.out",
              onUpdate: () => {
                hitNumber.textContent = String(Math.round(counterState.value));
                hitNumber.style.transform = `scale(${counterState.scale})`;
              },
            },
            1.12,
          );

          timeline.fromTo(
            "#frame04-live-hitstorm-hit-label",
            { y: 22, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
            1.28,
          );

          timeline.fromTo(
            "#frame04-live-hitstorm-hit-fill",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.78, ease: "power3.out" },
            1.12,
          );

          const resultData = [
            {
              selector: "#frame04-live-hitstorm-result-1",
              title: "GPT5.6 模型更新语音对话，真的笑麻了！！！",
              x: 30,
              rotation: -0.8,
            },
            {
              selector: "#frame04-live-hitstorm-result-2",
              title: "GPT5.6实测30小时！这能力真的行爆了？",
              x: -38,
              rotation: 0.9,
            },
            {
              selector: "#frame04-live-hitstorm-result-3",
              title: "「实测」OpenAI发布GPT5.6！ Sol、Terra、Luna？",
              x: 42,
              rotation: -0.7,
            },
          ];

          const sequenceBase = 1.07;
          const secondsPerCharacter = 0.007;
          let sequenceCursor = 1.56;
          const sequencedResults = resultData.map((item) => {
            const start = sequenceCursor;
            sequenceCursor += sequenceBase + item.title.length * secondsPerCharacter;
            return { ...item, start };
          });

          sequencedResults.forEach((item) => {
            timeline.fromTo(
              item.selector,
              { x: item.x, y: 28, scale: 0.88, rotation: item.rotation * -2.4, opacity: 0 },
              {
                x: 0,
                y: 0,
                scale: 1,
                rotation: item.rotation,
                opacity: 1,
                duration: 0.58,
                ease: "power3.out",
              },
              item.start,
            );
          });

          timeline.fromTo(
            "#frame04-live-hitstorm-cursor-trace",
            { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 0.72, duration: 0.48, ease: "power3.inOut" },
            5.85,
          );

          timeline.fromTo(
            "#frame04-live-hitstorm-cursor-actor",
            { x: 0, y: 0, opacity: 0 },
            { x: 0, y: 900, opacity: 1, duration: 0.52, ease: "power3.inOut" },
            5.85,
          );

          timeline.to(
            camera,
            {
              x: 0,
              y: -88,
              scale: 1.03,
              duration: 0.52,
              ease: "power3.inOut",
              onUpdate: applyCamera,
            },
            5.85,
          );

          timeline.fromTo(
            "#frame04-live-hitstorm-adapter",
            { y: 34, scale: 0.92, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
            5.94,
          );

          adapterChars.forEach((element, index) => {
            const state = { progress: 0 };
            timeline.to(
              state,
              {
                progress: 1,
                duration: 0.48,
                ease: "power3.out",
                onUpdate: () => {
                  const progress = state.progress;
                  if (progress < 0.62) {
                    element.textContent = pseudoGlyph(index * 1000 + Math.floor(progress * 100));
                  } else {
                    element.textContent = element.dataset.target;
                  }
                  element.style.transform = `rotateX(${90 - progress * 90}deg)`;
                  element.style.opacity = String(Math.min(1, progress * 2));
                },
              },
              6.02 + index * 0.032,
            );
          });

          function glowEnvelope(time) {
            const attack = 0.12;
            const sustainEnd = 0.35;
            const release = 0.34;
            const rest = 0.2;
            if (time < attack) return time / attack;
            if (time < sustainEnd) return 1;
            if (time < sustainEnd + release) {
              const decay = (time - sustainEnd) / release;
              return 1 - decay * (1 - rest);
            }
            return rest;
          }

          const glowDriver = { time: 0 };
          timeline.fromTo(
            glowDriver,
            { time: 0 },
            {
              time: 0.72,
              duration: 0.72,
              ease: "none",
              onUpdate: () => {
                const envelope = glowEnvelope(glowDriver.time);
                adapterValue.style.textShadow = `0 0 ${30 * envelope}px rgba(245, 247, 255, ${
                  0.16 + envelope * 0.74
                })`;
                adapterValue.style.transform = `scale(${1 + envelope * 0.1})`;
              },
            },
            6.56,
          );

          window.__timelines["04-live-hitstorm"] = timeline;
        })();
      </script>
    </template>
  </body>
</html>
