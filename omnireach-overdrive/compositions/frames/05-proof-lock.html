      <script>
        window.__timelines = window.__timelines || {};

        const scanWrap = document.getElementById("frame05-proof-lock-scan-flip");
        const scanTarget = scanWrap.dataset.target;
        const scanGlyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*";

        function scanGlyph(seed) {
          const normalized = ((seed * 9301 + 49297) % 233280) / 233280;
          return scanGlyphs[Math.floor(normalized * scanGlyphs.length)];
        }

        const scanGhost = document.createElement("div");
        scanGhost.className = "scan-ghost-row";
        scanGhost.textContent = scanTarget;
        scanWrap.appendChild(scanGhost);

        const scanLive = document.createElement("div");
        scanLive.className = "scan-live-row";
        const scanChars = [];
        Array.from(scanTarget).forEach((character, index) => {
          const span = document.createElement("span");
          span.className = "scan-char";
          span.dataset.target = character;
          span.textContent = scanGlyph(index * 1000);
          span.style.transform = "rotateX(90deg)";
          span.style.opacity = "0.15";
          scanLive.appendChild(span);
          scanChars.push(span);
        });
        scanWrap.appendChild(scanLive);

        const drawPaths = [
          document.getElementById("frame05-proof-lock-reticle-ring"),
          document.getElementById("frame05-proof-lock-reticle-corners"),
          document.getElementById("frame05-proof-lock-reticle-cross"),
          document.getElementById("frame05-proof-lock-connector-path"),
          document.getElementById("frame05-proof-lock-connector-error"),
          document.getElementById("frame05-proof-lock-connector-windows"),
          document.getElementById("frame05-proof-lock-connector-tabs"),
          document.getElementById("frame05-proof-lock-boundary-path"),
        ];

        drawPaths.forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = String(length);
          path.style.strokeDashoffset = String(length);
        });

        const cameraElement = document.getElementById("frame05-proof-lock-camera");
        const camera = { scale: 1 };

        function applyCamera() {
          cameraElement.style.transform = `translate3d(0, 0, 0) scale(${camera.scale})`;
        }
        applyCamera();

        const timeline = gsap.timeline({ paused: true });

        timeline.to(
          "#frame05-proof-lock-reticle-ring",
          { strokeDashoffset: 0, duration: 0.76, ease: "power2.out" },
          0,
        );
        timeline.to(
          "#frame05-proof-lock-reticle-corners",
          { strokeDashoffset: 0, duration: 0.68, ease: "power2.out" },
          0.34,
        );
        timeline.to(
          "#frame05-proof-lock-reticle-cross",
          { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
          0.72,
        );
        timeline.fromTo(
          "#frame05-proof-lock-reticle-core",
          { opacity: 0.2, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" },
          0.06,
        );

        scanChars.forEach((element, index) => {
          const state = { progress: 0 };
          timeline.to(
            state,
            {
              progress: 1,
              duration: 0.58,
              ease: "power3.out",
              onUpdate: () => {
                const progress = state.progress;
                if (progress < 0.62) {
                  element.textContent = scanGlyph(index * 1000 + Math.floor(progress * 100));
                } else {
                  element.textContent = element.dataset.target;
                }
                element.style.transform = `rotateX(${90 - progress * 90}deg)`;
                element.style.opacity = String(Math.min(1, 0.15 + progress * 1.5));
              },
            },
            0.18 + index * 0.055,
          );
        });

        timeline.fromTo(
          "#frame05-proof-lock-path-plate",
          { x: -470, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
          3.98,
        );
        timeline.fromTo(
          ".path-echo-1",
          { x: -530, opacity: 0.5 },
          { x: 0, opacity: 0, duration: 0.42, ease: "power4.out" },
          3.98,
        );
        timeline.fromTo(
          ".path-echo-2",
          { x: -590, opacity: 0.28 },
          { x: 0, opacity: 0, duration: 0.42, ease: "power4.out" },
          3.98,
        );
        timeline.to(
          "#frame05-proof-lock-connector-path",
          { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" },
          4.16,
        );

        timeline.fromTo(
          "#frame05-proof-lock-error-plate",
          { x: 210, opacity: 0, scale: 0.92 },
          { x: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power4.out" },
          4.78,
        );
        timeline.to(
          "#frame05-proof-lock-connector-error",
          { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
          5.06,
        );

        const glowElement = document.getElementById("frame05-proof-lock-error-value");
        const glowDriver = { time: 0 };

        function glowEnvelope(time) {
          if (time < 0.12) return time / 0.12;
          if (time < 0.24) return 1;
          if (time < 0.56) return 1 - ((time - 0.24) / 0.32) * 0.78;
          return 0.22;
        }

        timeline.to(
          glowDriver,
          {
            time: 0.56,
            duration: 0.56,
            ease: "none",
            onUpdate: () => {
              const envelope = glowEnvelope(glowDriver.time);
              glowElement.style.textShadow = `0 0 ${34 * envelope}px rgba(182, 255, 59, ${0.18 + envelope * 0.68})`;
              glowElement.style.transform = `scale(${1 + envelope * 0.1})`;
            },
          },
          5.26,
        );

        timeline.fromTo(
          "#frame05-proof-lock-windows-plate",
          { x: -220, y: 70, opacity: 0, scale: 0.92 },
          { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.54, ease: "power4.out" },
          7.18,
        );
        timeline.to(
          "#frame05-proof-lock-connector-windows",
          { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
          7.46,
        );

        const windowCounters = [
          document.getElementById("frame05-proof-lock-window-before"),
          document.getElementById("frame05-proof-lock-window-after"),
        ];
        windowCounters.forEach((element) => {
          timeline.fromTo(
            element,
            { scale: 42 / 64 },
            { scale: 1, duration: 1.18, ease: "power3.out" },
            7.22,
          );
        });

        timeline.fromTo(
          "#frame05-proof-lock-tabs-plate",
          { x: 220, y: 70, opacity: 0, scale: 0.92 },
          { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.54, ease: "power4.out" },
          8.34,
        );
        timeline.to(
          "#frame05-proof-lock-connector-tabs",
          { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
          8.62,
        );

        const tabCounters = [
          document.getElementById("frame05-proof-lock-tab-before"),
          document.getElementById("frame05-proof-lock-tab-after"),
        ];
        tabCounters.forEach((element) => {
          timeline.fromTo(
            element,
            { scale: 42 / 64 },
            { scale: 1, duration: 1.18, ease: "power3.out" },
            8.38,
          );
        });

        timeline.to(
          "#frame05-proof-lock-boundary-path",
          { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" },
          10.02,
        );
        timeline.fromTo(
          "#frame05-proof-lock-boundary-content",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.56, ease: "power3.out" },
          10.28,
        );

        const compactTargets = [
          { selector: "#frame05-proof-lock-path-shell", x: 221, y: 284 },
          { selector: "#frame05-proof-lock-error-shell", x: -221, y: 284 },
          { selector: "#frame05-proof-lock-windows-shell", x: 221, y: -279 },
          { selector: "#frame05-proof-lock-tabs-shell", x: -221, y: -279 },
        ];
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        compactTargets.forEach((target, index) => {
          const angle = index * goldenAngle;
          const depth = 180 - index * 120;
          timeline.to(
            target.selector,
            {
              x: target.x * 0.62 + Math.cos(angle) * 74,
              y: target.y * 0.62 + Math.sin(angle) * 58,
              z: depth,
              rotationX: Math.sin(angle) * 38,
              rotationY: Math.cos(angle) * 38,
              scale: 0.42,
              opacity: 0.72,
              duration: 0.28,
              ease: "power2.in",
            },
            12.58 + index * 0.025,
          );
          timeline.to(
            target.selector,
            {
              x: target.x,
              y: target.y,
              z: 0,
              rotationX: 0,
              rotationY: 0,
              scale: 0.17,
              opacity: 0.18,
              duration: 0.58,
              ease: "power3.out",
            },
            12.86 + index * 0.04,
          );
        });

        timeline.fromTo(
          "#frame05-proof-lock-search-lockup",
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" },
          12.84,
        );

        timeline.to(
          camera,
          {
            scale: 1.18,
            duration: 1.22,
            ease: "power2.inOut",
            onUpdate: applyCamera,
          },
          12.58,
        );
        timeline.to(
          camera,
          {
            scale: 6.8,
            duration: 0.4,
            ease: "power4.in",
            onUpdate: applyCamera,
          },
          13.8,
        );

        timeline.fromTo(
          ".streak-bar",
          { scaleX: 0.08, opacity: 0 },
          {
            scaleX: 1,
            opacity: 0.82,
            duration: 0.14,
            ease: "power4.in",
            stagger: 0.018,
          },
          13.86,
        );
        timeline.to(
          ".streak-bar",
          {
            scaleX: 1.22,
            opacity: 0,
            duration: 0.18,
            ease: "power4.out",
            stagger: 0.012,
          },
          14.04,
        );
        timeline.to(
          "#frame05-proof-lock-camera",
          { opacity: 0, duration: 0.18, ease: "power2.out" },
          14.06,
        );

        timeline.fromTo(
          "#frame05-proof-lock-cta",
          { opacity: 0, scale: 1.24, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" },
          14.1,
        );
        timeline.fromTo(
          "#frame05-proof-lock-cursor",
          { x: 930, y: 330, opacity: 0, scale: 1 },
          { x: 844, y: 838, opacity: 1, scale: 1, duration: 0.34, ease: "power2.inOut" },
          14.12,
        );
        timeline.to(
          ["#frame05-proof-lock-install-target", "#frame05-proof-lock-cursor"],
          { scale: 0.92, duration: 0.08, ease: "power1.in" },
          14.48,
        );
        timeline.to(
          "#frame05-proof-lock-install-target",
          { boxShadow: "4px 4px 0 #ff2fb3", duration: 0.08, ease: "power1.in" },
          14.48,
        );
        timeline.to(
          ["#frame05-proof-lock-install-target", "#frame05-proof-lock-cursor"],
          { scale: 1, duration: 0.22, ease: "back.out(1.8)" },
          14.6,
        );
        timeline.to(
          "#frame05-proof-lock-install-target",
          { boxShadow: "8px 8px 0 #ff2fb3", duration: 0.22, ease: "power2.out" },
          14.6,
        );

        window.__timelines["05-proof-lock"] = timeline;
      </script>
    </template>
  </body>
</html>
