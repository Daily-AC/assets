<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F3F0E7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-train-dont-tab-hop"
        class="scene"
        data-composition-id="01-train-dont-tab-hop"
        data-composition-src="compositions/frames/01-train-dont-tab-hop.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-find-the-right-problem"
        class="scene"
        data-composition-id="02-find-the-right-problem"
        data-composition-src="compositions/frames/02-find-the-right-problem.html"
        data-start="5"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-start-the-whole-round"
        class="scene"
        data-composition-id="03-start-the-whole-round"
        data-composition-src="compositions/frames/03-start-the-whole-round.html"
        data-start="12"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-agent-test-submit"
        class="scene"
        data-composition-id="04-agent-test-submit"
        data-composition-src="compositions/frames/04-agent-test-submit.html"
        data-start="20"
        data-duration="9.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-open-source"
        class="scene"
        data-composition-id="05-open-source"
        data-composition-src="compositions/frames/05-open-source.html"
        data-start="29"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-train-dont-tab-hop", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-find-the-right-problem", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-find-the-right-problem", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 12);
        tl.fromTo("#el-03-start-the-whole-round", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 12);
        tl.to("#el-03-start-the-whole-round", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.fromTo("#el-04-agent-test-submit", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.to("#el-04-agent-test-submit", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 29);
        tl.fromTo("#el-05-open-source", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 29);
        tl.to({}, { duration: 35 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
