  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-download"]');
      const byId = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["03-download"] = tl;

      const commandMask = byId("03-download-command-mask");
      const commandSheet = byId("03-download-command-sheet");
      const below = byId("03-download-below");
      const commandText = byId("03-download-command-text");
      const cursor = byId("03-download-cursor");
      const submitLabel = byId("03-download-submit-label");
      const ledger = byId("03-download-ledger");
      const ledgerCount = byId("03-download-ledger-count");
      const receiptMask = byId("03-download-receipt-mask");
      const receipt = byId("03-download-receipt");
      const verificationEdge = byId("03-download-verification-edge");

      const COMMAND_BODY_H = 280;
      const COMMAND_COLLAPSED_H = 96;
      const commandInitialScale = COMMAND_COLLAPSED_H / COMMAND_BODY_H;
      tl.set(commandMask, { scaleY: commandInitialScale, transformOrigin: "50% 0%" }, 0);
      tl.set(commandSheet, { scaleY: 1 / commandInitialScale, transformOrigin: "50% 0%" }, 0);
      tl.set(below, { y: COMMAND_COLLAPSED_H - COMMAND_BODY_H }, 0);

      const commandGrow = { h: COMMAND_COLLAPSED_H };
      tl.fromTo(
        commandGrow,
        { h: COMMAND_COLLAPSED_H },
        {
          h: COMMAND_BODY_H,
          duration: 2.7,
          ease: "power3.out",
          onUpdate: () => {
            const s = Math.max(commandGrow.h / COMMAND_BODY_H, 0.0001);
            gsap.set(commandMask, { scaleY: s, transformOrigin: "50% 0%" });
            gsap.set(commandSheet, { scaleY: 1 / s, transformOrigin: "50% 0%" });
            gsap.set(below, { y: commandGrow.h - COMMAND_BODY_H });
          },
        },
        1.3,
      );

      const commandChunks = [
        { start: 0.0, duration: 0.82, text: "omnireach media download <douyin-url>", color: "#f6f8fa" },
        { start: 0.9, duration: 0.92, text: "\n  --quality small --max-size-mb 20", color: "#e8a55a" },
        { start: 1.92, duration: 0.55, text: "\n  --json", color: "#5db8a6" },
      ];
      const commandSequence = [{ t: 0, text: "", color: "#f6f8fa" }];
      let accumulated = "";
      commandChunks.forEach((chunk) => {
        const steps = Math.max(2, Math.ceil(chunk.text.length / 4));
        for (let i = 1; i <= steps; i += 1) {
          const t = chunk.start + (chunk.duration * i) / steps;
          commandSequence.push({
            t,
            text: accumulated + chunk.text.slice(0, Math.ceil((chunk.text.length * i) / steps)),
            color: chunk.color,
          });
        }
        accumulated += chunk.text;
      });

      const commandAt = (time) => {
        for (let i = commandSequence.length - 1; i >= 0; i -= 1) {
          if (time >= commandSequence[i].t) return commandSequence[i];
        }
        return commandSequence[0];
      };
      const typingDriver = { t: 0 };
      const cursorBlink = { p: 0 };

      tl.to(
        typingDriver,
        {
          t: 2.7,
          duration: 2.7,
          ease: "none",
          onUpdate: () => {
            const entry = commandAt(typingDriver.t);
            commandText.textContent = entry.text;
            cursor.style.background = entry.color;
          },
        },
        1.3,
      );
      tl.to(
        cursorBlink,
        {
          p: Math.PI * 2 * 4,
          duration: 2.7,
          ease: "none",
          onUpdate: () => {
            const recentTyping = commandSequence.some(
              (entry) => entry.t <= typingDriver.t && typingDriver.t - entry.t < 0.14,
            );
            cursor.style.opacity = recentTyping || Math.sin(cursorBlink.p) > 0 ? "1" : "0";
          },
        },
        1.3,
      );

      tl.set(submitLabel, { textContent: "RUNNING" }, 4.0);

      const statuses = [
        { id: 1, label: "explicit browser auth" },
        { id: 2, label: "format selected" },
        { id: 3, label: "size limit passed" },
        { id: 4, label: "sha256 verified" },
      ];
      tl.set(statuses.map((status) => byId(`03-download-status-${status.id}`)), {
        opacity: 0,
        scale: 0.96,
        y: 12,
      }, 0);

      let statusCursor = 4.0;
      const statusTimeline = statuses.map((status) => {
        const duration = 0.36 + status.label.length * 0.011;
        const start = statusCursor;
        statusCursor += duration;
        return { ...status, start, end: statusCursor };
      });

      statusTimeline.forEach((status, index) => {
        const row = byId(`03-download-status-${status.id}`);
        const pending = byId(`03-download-pending-${status.id}`);
        const check = byId(`03-download-check-${status.id}`);
        const checkLength = check.getTotalLength();
        check.style.strokeDasharray = `${checkLength}`;
        check.style.strokeDashoffset = `${checkLength}`;

        tl.fromTo(
          row,
          { opacity: 0, scale: 0.96, y: 12 },
          { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" },
          status.start,
        );

        const checkAt = index < statusTimeline.length - 1
          ? statusTimeline[index + 1].start
          : Math.min(6.58, status.end + 0.24);
        tl.set(pending, { opacity: 0 }, checkAt);
        tl.to(
          check,
          { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
          checkAt,
        );
        tl.set(ledgerCount, { textContent: `${index + 1} / 4` }, checkAt);
      });

      tl.to(ledger, { y: -112, duration: 0.52, ease: "power3.out" }, 6.9);

      const RECEIPT_H = 430;
      const RECEIPT_COLLAPSED_H = 1;
      const receiptInitialScale = RECEIPT_COLLAPSED_H / RECEIPT_H;
      tl.set(receiptMask, { scaleY: receiptInitialScale, transformOrigin: "50% 100%" }, 0);
      tl.set(receipt, { scaleY: 1 / receiptInitialScale, transformOrigin: "50% 100%" }, 0);

      const receiptGrow = { h: RECEIPT_COLLAPSED_H };
      tl.fromTo(
        receiptGrow,
        { h: RECEIPT_COLLAPSED_H },
        {
          h: RECEIPT_H,
          duration: 0.56,
          ease: "power3.out",
          onUpdate: () => {
            const s = Math.max(receiptGrow.h / RECEIPT_H, 0.0001);
            gsap.set(receiptMask, { scaleY: s, transformOrigin: "50% 100%" });
            gsap.set(receipt, { scaleY: 1 / s, transformOrigin: "50% 100%" });
          },
        },
        6.9,
      );

      tl.set([
        byId("03-download-field-1"),
        byId("03-download-field-2"),
        byId("03-download-field-3"),
      ], { scale: 0, opacity: 0, y: 10 }, 0);

      [7.16, 7.68, 8.18].forEach((at, index) => {
        tl.fromTo(
          byId(`03-download-field-${index + 1}`),
          { scale: 0, opacity: 0, y: 10 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          at,
        );
      });

      tl.set(byId("03-download-final-pending"), { opacity: 0 }, 0);
      tl.set(byId("03-download-final-verified"), { opacity: 0 }, 0);
      tl.set(verificationEdge, { scaleY: 0 }, 0);
      tl.fromTo(
        byId("03-download-final-pending"),
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power1.out" },
        7.32,
      );

      tl.set(cursor, { opacity: 0 }, 8.8);
      tl.set(submitLabel, { textContent: "COMPLETE" }, 8.8);
      tl.set(byId("03-download-final-pending"), { opacity: 0 }, 8.8);
      tl.set(byId("03-download-final-verified"), { opacity: 1 }, 8.8);
      tl.set(verificationEdge, { scaleY: 1 }, 8.8);

      tl.to(root, { opacity: 1, duration: 1.2, ease: "none" }, 8.8);
    })();
  </script>
