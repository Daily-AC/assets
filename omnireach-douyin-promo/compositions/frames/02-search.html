  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-search"] = tl;

      const stack = document.getElementById("02-search-window-stack");
      const back = document.getElementById("02-search-depth-back");
      const mid = document.getElementById("02-search-depth-mid");
      const terminal = document.getElementById("02-search-terminal");
      const prompt = document.getElementById("02-search-prompt");
      const submit = document.getElementById("02-search-submit");
      const cursor = document.getElementById("02-search-cursor");
      const statusLine = document.getElementById("02-search-status-line");
      const statusText = document.getElementById("02-search-status-text");
      const loaderWrap = document.getElementById("02-search-loader-wrap");
      const loaderHand = document.getElementById("02-search-loader-hand");
      const success = document.getElementById("02-search-success");
      const results = document.getElementById("02-search-results");
      const footer = document.getElementById("02-search-footer");

      tl.fromTo(
        stack,
        { y: 150, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        back,
        { y: 38, scale: 0.97, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        mid,
        { y: 28, scale: 0.98, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        terminal,
        { y: 18, scale: 0.985, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.08,
      );

      const commandParts = [
        { id: "02-search-command-program", text: "omnireach", color: "#0969DA" },
        { id: "02-search-command-main", text: " search ", color: "#F6F8FA" },
        { id: "02-search-command-flag", text: "--on", color: "#0969DA" },
        { id: "02-search-command-value", text: " douyin ", color: "#F6F8FA" },
        { id: "02-search-command-json", text: "--json", color: "#0969DA" },
        { id: "02-search-command-string", text: " \"AI agent\"", color: "#5DB8A6" },
      ].map((part) => ({ ...part, el: document.getElementById(part.id) }));
      const fullCommand = commandParts.map((part) => part.text).join("");

      function renderCommand(count) {
        let remaining = Math.max(0, Math.min(fullCommand.length, Math.floor(count)));
        let cursorColor = commandParts[0].color;
        commandParts.forEach((part) => {
          const visible = Math.min(part.text.length, remaining);
          part.el.textContent = part.text.slice(0, visible);
          if (remaining > 0) cursorColor = part.color;
          remaining -= visible;
        });
        cursor.style.background = cursorColor;
      }

      renderCommand(0);
      const typeState = { count: 0 };
      tl.to(
        typeState,
        {
          count: fullCommand.length,
          duration: 2.8,
          ease: "none",
          onUpdate: () => renderCommand(typeState.count),
        },
        1.2,
      );

      const blinkState = { p: 0 };
      tl.to(
        blinkState,
        {
          p: Math.PI * 2 * 4,
          duration: 2.8,
          ease: "none",
          onUpdate: () => {
            cursor.style.opacity = Math.sin(blinkState.p) > 0 ? "1" : "0";
          },
        },
        1.2,
      );

      tl.set(cursor, { opacity: 0 }, 4.0);
      tl.fromTo(
        submit,
        { scale: 1, color: "rgba(246,248,250,.56)", borderColor: "rgba(246,248,250,.18)" },
        { scale: 0.9, color: "#0969DA", borderColor: "#0969DA", duration: 0.12, ease: "power2.in" },
        4.0,
      );
      tl.to(
        submit,
        { scale: 1, color: "rgba(246,248,250,.72)", borderColor: "rgba(246,248,250,.24)", duration: 0.2, ease: "power3.out" },
        4.12,
      );
      tl.to(prompt, { y: -10, scale: 0.96, duration: 0.28, ease: "power3.out" }, 4.02);
      tl.fromTo(
        statusLine,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" },
        4.08,
      );

      const statusSequence = [
        { t: 4.0, text: "searching native source" },
        { t: 7.1, text: "3 sources normalized" },
      ];
      function statusAt(time) {
        for (let i = statusSequence.length - 1; i >= 0; i -= 1) {
          if (time >= statusSequence[i].t) return statusSequence[i];
        }
        return statusSequence[0];
      }
      const statusDriver = { t: 4.0 };
      let lastStatus = "";
      tl.to(
        statusDriver,
        {
          t: 8.0,
          duration: 4.0,
          ease: "none",
          onUpdate: () => {
            const entry = statusAt(statusDriver.t);
            if (entry.text !== lastStatus) {
              statusText.textContent = entry.text;
              lastStatus = entry.text;
            }
          },
        },
        4.0,
      );

      const loaderState = { deg: 0 };
      tl.to(
        loaderState,
        {
          deg: 900,
          duration: 3.1,
          ease: "none",
          onUpdate: () => loaderHand.setAttribute("transform", `rotate(${loaderState.deg} 16 16)`),
        },
        4.0,
      );

      const resultContent = [
        { id: "02-search-result-1", title: "AI agent", body: "douyin.com/…" },
        { id: "02-search-result-2", title: "AI agent workflow", body: "douyin.com/…" },
        { id: "02-search-result-3", title: "AI agent tools", body: "douyin.com/…" },
      ];
      const weights = resultContent.map((item) => 0.42 + (item.title.length + item.body.length) * 0.008);
      const weightTotal = weights.reduce((sum, value) => sum + value, 0);
      let cumulative = 0;
      const resultTimeline = resultContent.map((item, index) => {
        const start = 5.3 + (cumulative / weightTotal) * 1.25;
        cumulative += weights[index];
        return { ...item, start };
      });

      resultTimeline.forEach((item) => {
        const row = document.getElementById(item.id);
        tl.fromTo(
          row,
          { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          item.start,
        );
      });
      tl.to(results, { y: -112, duration: 0.62, ease: "power3.out" }, 6.34);

      tl.set(loaderWrap, { display: "none" }, 7.1);
      tl.set(success, { display: "grid" }, 7.1);
      tl.fromTo(
        success,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        7.1,
      );
      tl.fromTo(
        footer,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        7.1,
      );
    })();
  </script>
