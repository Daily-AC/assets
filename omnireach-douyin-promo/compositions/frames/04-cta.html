  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-cta"]');
      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const tl = gsap.timeline({ paused: true });

      const rulePath = q('[id="04-cta-rule-path"]');
      const ruleLength = rulePath.getTotalLength();
      rulePath.style.strokeDasharray = `${ruleLength}`;
      rulePath.style.strokeDashoffset = `${ruleLength}`;

      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-image-panel"]',
        { yPercent: -100, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.72, ease: 'power2.out' },
        0
      );
      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-favicon"]',
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: 'power3.out' },
        0.18
      );
      const versionWords = qa('[class~="04-cta-version-words"] span');
      let versionCursor = 0.24;
      const versionSchedule = versionWords.map((word) => {
        const start = versionCursor;
        versionCursor += 0.16 + word.textContent.length * 0.018;
        return { word, start };
      });
      versionSchedule.forEach(({ word, start }) => {
        tl.fromTo(
          word,
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' },
          start
        );
      });
      tl.to(
        rulePath,
        { strokeDashoffset: 0, duration: 0.62, ease: 'power2.out' },
        0.78
      );

      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-tools-label"]',
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out' },
        1.45
      );
      qa('[class~="04-cta-tool"]').forEach((tool, index) => {
        tl.fromTo(
          tool,
          { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.58, ease: 'power3.out' },
          1.55 + index * 0.06
        );
      });

      tl.to(
        '[data-composition-id="04-cta"] [class~="04-cta-tools"]',
        { y: -112, scale: 0.88, opacity: 0.55, duration: 0.78, ease: 'power2.inOut' },
        3.62
      );

      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-morph-card"]',
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: 'power1.out' },
        3.5
      );
      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-morph-card"]',
        { scale: 0.14, borderRadius: 56 / 0.14, backgroundColor: '#1b1d1f', boxShadow: '0 1px 3px rgba(31,35,40,0.08)' },
        { scale: 1, borderRadius: 8, backgroundColor: '#151618', boxShadow: '0 4px 16px rgba(31,35,40,0.04)', duration: 0.92, ease: 'power2.inOut' },
        3.68
      );
      tl.to(
        '[data-composition-id="04-cta"] [class~="04-cta-content-old"]',
        { opacity: 0, duration: 0.36, ease: 'power1.in' },
        3.8
      );
      tl.fromTo(
        '[data-composition-id="04-cta"] [class~="04-cta-content-new"]',
        { opacity: 0 },
        { opacity: 1, duration: 0.36, ease: 'power1.out' },
        4.24
      );

      const typed = 'github.com/Daily-AC/omnireach';
      const typedStates = [
        { t: 4.25, text: '', color: '#f6f8fa' },
        { t: 4.38, text: 'github', color: '#d7f6e0' },
        { t: 4.52, text: 'github.com/', color: '#f6f8fa' },
        { t: 4.68, text: 'github.com/Daily', color: '#d7f6e0' },
        { t: 4.84, text: 'github.com/Daily-AC/', color: '#f6f8fa' },
        { t: 5.08, text: typed, color: '#5db872' }
      ];
      const terminalText = q('[id="04-cta-terminal-text"]');
      const cursor = q('[id="04-cta-cursor"]');
      const finalState = q('[id="04-cta-final-state"]');
      const driver = { t: 0 };
      const blink = { p: 0 };

      const stateAt = (time, states) => {
        for (let index = states.length - 1; index >= 0; index -= 1) {
          if (time >= states[index].t) return states[index];
        }
        return states[0];
      };

      tl.to(
        driver,
        {
          t: 7.5,
          duration: 7.5,
          ease: 'none',
          onUpdate: () => {
            const state = stateAt(driver.t, typedStates);
            terminalText.textContent = state.text;
            cursor.style.background = state.color;
            finalState.textContent = driver.t >= 5.5 ? 'v0.18 已发布' : '';
          }
        },
        0
      );

      tl.to(
        blink,
        {
          p: Math.PI * 2 * 10,
          duration: 7.5,
          ease: 'none',
          onUpdate: () => {
            const typing = typedStates.some((state, index) => index > 0 && state.t <= driver.t && driver.t - state.t < 0.12);
            cursor.style.opacity = driver.t < 4.24 ? '0' : typing || Math.sin(blink.p) > 0 ? '1' : '0';
          }
        },
        0
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['04-cta'] = tl;
    })();
  </script>
